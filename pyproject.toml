[project]
name = "lrh-m365-auth"
version = "0.1.0"
description = "Shared Microsoft 365 authentication for local connectors."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msal>=1.31,<2",
    "msal-extensions[portalocker]>=1.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
