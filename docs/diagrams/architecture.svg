  <text class="detail code" x="1220" y="432" style="font-size:18px">outlook.office.com</text>
  <text class="detail" x="1580" y="432" style="font-size:19px">mail changes, rules,</text>
  <text class="detail" x="1580" y="458" style="font-size:19px">signatures, events</text>
  <path d="M730 478 H1830" stroke="#eef2f6" stroke-width="1.5"/>

  <rect x="740" y="494" width="32" height="26" rx="5" fill="#b7791f"/><text class="badge" x="756" y="513" text-anchor="middle">O</text>
  <text class="detail code" x="782" y="514" style="font-size:19px">m365.search</text>
  <text class="detail" x="1000" y="514" style="font-size:19px">One Outlook Web</text>
  <text class="detail code" x="1220" y="514" style="font-size:18px">outlook.office.com/search</text>
  <text class="detail" x="1580" y="514" style="font-size:19px">Search v2: events,</text>
  <text class="detail" x="1580" y="540" style="font-size:19px">Teams messages</text>
  <path d="M730 560 H1830" stroke="#eef2f6" stroke-width="1.5"/>

  <rect x="740" y="576" width="32" height="26" rx="5" fill="#5b5fc7"/><text class="badge" x="756" y="595" text-anchor="middle">T</text>
