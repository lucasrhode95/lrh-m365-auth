  <text class="detail" x="1000" y="596" style="font-size:19px">Teams</text>
  <text class="detail code" x="1220" y="596" style="font-size:18px">api.spaces.skype.com</text>
  <text class="detail" x="1580" y="596" style="font-size:19px">Teams session (AuthZ)</text>
  <path d="M730 622 H1830" stroke="#eef2f6" stroke-width="1.5"/>

  <rect x="740" y="638" width="32" height="26" rx="5" fill="#5b5fc7"/><text class="badge" x="756" y="657" text-anchor="middle">T</text>
  <text class="detail code" x="782" y="658" style="font-size:19px">teams.csa</text>
  <text class="detail" x="1000" y="658" style="font-size:19px">Teams</text>
  <text class="detail code" x="1220" y="658" style="font-size:18px">chatsvcagg.teams.microsoft.com</text>
  <text class="detail" x="1580" y="658" style="font-size:19px">Teams chat catalog</text>
  <path d="M730 684 H1830" stroke="#eef2f6" stroke-width="1.5"/>

  <rect x="740" y="700" width="32" height="26" rx="5" fill="#2b6cb0"/><text class="badge" x="756" y="719" text-anchor="middle">G</text>
  <text class="detail code" x="782" y="720" style="font-size:19px">teams.graph</text>
  <text class="detail" x="1000" y="720" style="font-size:19px">Teams</text>
  <text class="detail code" x="1220" y="720" style="font-size:18px">graph.microsoft.com</text>
  <text class="detail" x="1580" y="720" style="font-size:19px">Teams Graph; Outlook</text>
  <text class="detail" x="1580" y="746" style="font-size:19px">calendar windows</text>
  <text class="muted" x="740" y="790">Refused client/scope pairs (AADSTS65002) are recorded and never requested again.</text>

  <!-- Microsoft. -->
  <rect x="1940" y="170" width="580" height="660" rx="14" fill="#f7f9fc" stroke="#c7d5e2" stroke-width="1.5"/>
  <path d="M1940 244 V184 Q1940 170 1954 170 H2506 Q2520 170 2520 184 V244 Z" fill="#183153"/>
  <text class="card-title" x="1960" y="203">MICROSOFT</text>
  <text class="card-subtitle" x="1960" y="227">first-party public clients · no app registration</text>
  <rect x="1960" y="260" width="540" height="300" fill="#fff" stroke="#c7d5e2" stroke-width="1.5"/>
  <text class="section-title" x="1980" y="294">Public clients</text>
  <text class="detail" x="1980" y="330">Outlook Mobile</text>
  <text class="detail code" x="1980" y="356" style="font-size:17px">27922004-5251-4030-b22d-91ecd9a37ea4</text>
  <text class="detail" x="1980" y="396">One Outlook Web</text>
  <text class="detail code" x="1980" y="422" style="font-size:17px">9199bf20-a13f-4107-85dc-02114787ef48</text>
  <text class="detail" x="1980" y="462">Teams</text>
  <text class="detail code" x="1980" y="488" style="font-size:17px">1fec8e78-bce4-4aaf-ab1b-5451cc387264</text>
  <text class="muted" x="1980" y="532">Microsoft's own app ids, not secrets</text>
  <rect x="1960" y="580" width="540" height="230" fill="#fff" stroke="#c7d5e2" stroke-width="1.5"/>
  <text class="section-title" x="1980" y="614">Entra ID</text>
  <text class="detail code" x="1980" y="648" style="font-size:19px">login.microsoftonline.com/organizations</text>
  <text class="detail" x="1980" y="684">device code, once per profile</text>
  <text class="detail" x="1980" y="714">that needs approval; MFA as the</text>
  <text class="detail" x="1980" y="744">tenant requires; refresh tokens</text>
  <text class="detail" x="1980" y="774">renew access silently</text>

  <path class="api-flow" d="M1860 500 H1936"/>
  <text class="flow-label" x="1898" y="488" text-anchor="middle" style="font-size:18px">MSAL</text>

  <!-- Token provider. -->
  <rect x="80" y="890" width="1180" height="420" rx="14" fill="#f7f9fc" stroke="#c7d5e2" stroke-width="1.5"/>
  <path d="M80 964 V904 Q80 890 94 890 H1246 Q1260 890 1260 904 V964 Z" fill="#183153"/>
  <text class="card-title" x="100" y="923">TOKEN PROVIDER</text>
  <text class="card-subtitle" x="100" y="947"><tspan class="code">tokens.py</tspan> · <tspan class="code">TokenProvider</tspan> · <tspan class="code">binding.py</tspan> · <tspan class="code">AccountBoundTokenSource</tspan></text>
  <rect x="100" y="980" width="560" height="310" fill="#fff" stroke="#c7d5e2" stroke-width="1.5"/>
  <text class="head" x="118" y="1014">Methods</text>
  <text class="detail" x="118" y="1046">• <tspan class="code">get_token(profile)</tspan>: silent, never prompts</text>
  <text class="detail" x="118" y="1076">• <tspan class="code">bootstrap()</tspan>: every profile; asks only</text>
  <text class="detail" x="134" y="1102">for those that still need approval</text>
  <text class="detail" x="118" y="1132">• <tspan class="code">sign_in(profile)</tspan>: one device-code flow</text>
  <text class="detail" x="118" y="1162">• <tspan class="code">sign_out()</tspan>: delete the cache, all connectors</text>
  <text class="detail" x="118" y="1192">• <tspan class="code">status()</tspan>: offline view, no token values</text>
  <text class="detail" x="118" y="1222">• <tspan class="code">cached_account()</tspan>: the cache's owner</text>
  <rect x="680" y="980" width="560" height="310" fill="#fff" stroke="#c7d5e2" stroke-width="1.5"/>
  <text class="head" x="698" y="1014">Rules</text>
  <text class="detail" x="698" y="1046">Only <tspan class="code">auth</tspan> prompts; MCP and UI calls never do,</text>
  <text class="detail" x="698" y="1072">they report the <tspan class="code">auth</tspan> command instead.</text>
  <text class="detail" x="698" y="1110">A connector binds its token source to the</text>
  <text class="detail" x="698" y="1136">account that owns its service context: after</text>
  <text class="detail" x="698" y="1162">a switch, old contexts fail with an account</text>
  <text class="detail" x="698" y="1188">mismatch instead of mixing accounts.</text>
  <text class="detail" x="698" y="1226">This package makes no Graph, Outlook or</text>
  <text class="detail" x="698" y="1252">Teams requests, and runs no background work.</text>

  <!-- Local files. -->
  <rect x="1340" y="890" width="1180" height="420" rx="14" fill="#f7f9fc" stroke="#c7d5e2" stroke-width="1.5"/>
  <path d="M1340 964 V904 Q1340 890 1354 890 H2506 Q2520 890 2520 904 V964 Z" fill="#183153"/>
  <text class="card-title" x="1360" y="923">SHARED CACHE</text>
  <text class="card-subtitle" x="1360" y="947"><tspan class="code">~/.lrh-m365-auth/</tspan> · or <tspan class="code">M365_AUTH_HOME</tspan> · one folder for every connector</text>
  <rect x="1360" y="980" width="1140" height="310" fill="#fff" stroke="#c7d5e2" stroke-width="1.5"/>
  <text class="detail" x="1380" y="1018"><tspan class="code">token-cache.bin</tspan></text>
  <text class="detail" x="1700" y="1018">MSAL tokens, encrypted for your user by the operating system;</text>
  <text class="detail" x="1700" y="1044">fails closed when encryption is unavailable</text>
  <text class="detail" x="1380" y="1090"><tspan class="code">token-cache.bin.acquire.lock</tspan></text>
  <text class="detail" x="1700" y="1116">cross-process lock around every read and write</text>
  <text class="detail" x="1380" y="1162"><tspan class="code">account-state.json</tspan></text>
  <text class="detail" x="1700" y="1162">active account and a generation marker: a sign-out</text>
  <text class="detail" x="1700" y="1188">or switch makes running processes drop their tokens</text>
  <text class="muted" x="1380" y="1240"><tspan class="code">--unsecure</tspan> uses separate plaintext development files, with a warning; never a fallback.</text>

  <path class="local-flow" d="M1260 1100 H1336"/>
  <path class="call-flow" d="M1000 830 V886"/>
  <text class="flow-label" x="1020" y="866">every profile request</text>

  <!-- Legend. -->
  <rect x="80" y="1360" width="32" height="26" rx="5" fill="#2b6cb0"/>
  <text class="badge" x="96" y="1379" text-anchor="middle">G</text>
  <text class="flow-label" x="122" y="1380">Graph</text>
  <rect x="220" y="1360" width="32" height="26" rx="5" fill="#b7791f"/>
  <text class="badge" x="236" y="1379" text-anchor="middle">O</text>
  <text class="flow-label" x="262" y="1380">Outlook Web</text>
  <rect x="420" y="1360" width="32" height="26" rx="5" fill="#5b5fc7"/>
  <text class="badge" x="436" y="1379" text-anchor="middle">T</text>
  <text class="flow-label" x="462" y="1380">Teams services</text>
  <path class="api-flow" d="M680 1373 H750"/>
  <text class="flow-label" x="762" y="1380">sign-in over HTTPS</text>
  <path class="local-flow" d="M1010 1373 H1080"/>
  <text class="flow-label" x="1092" y="1380">local read and write</text>
  <path class="call-flow" d="M1320 1373 H1390"/>
  <text class="flow-label" x="1402" y="1380">call (points to the callee)</text>
</svg>
