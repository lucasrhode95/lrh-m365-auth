  <rect x="740" y="330" width="32" height="26" rx="5" fill="#2b6cb0"/><text class="badge" x="756" y="349" text-anchor="middle">G</text>
  <text class="detail code" x="782" y="350" style="font-size:19px">outlook.graph</text>
