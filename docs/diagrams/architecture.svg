<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1420" viewBox="0 0 2600 1420" role="img" aria-labelledby="title description">
  <title id="title">Shared Microsoft 365 sign-in</title>
  <desc id="description">lrh-m365-auth holds six named profiles. Each profile is one Microsoft-owned public client asking for one resource: Outlook Mobile for Graph mail reads, One Outlook Web for the Outlook APIs and Search v2, and the Teams client for the Teams session, the chat catalog and Graph. The Outlook, Teams and SharePoint connectors each request the profiles they need through one TokenProvider. Tokens live in one encrypted cache shared by every connector, locked across processes, with an account-state marker that makes running processes drop memoized tokens after a sign-out or an account switch.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #183153; font-size: 50px; font-weight: 700; }
      .subtitle { fill: #183153; font-size: 30px; }
      .card-title { fill: #fff; font-size: 30px; font-weight: 700; }
      .card-subtitle { fill: #c8d8e8; font-size: 20px; }
      .section-title { fill: #183153; font-size: 24px; font-weight: 700; }
      .detail { fill: #53677b; font-size: 20px; }
      .head { fill: #183153; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
      .muted { fill: #8496a8; font-size: 19px; font-style: italic; }
      .code { font-family: "Courier New", Consolas, monospace; font-weight: 700; }
      .badge { fill: #fff; font-size: 17px; font-weight: 700; }
      .note-title { fill: #086d68; font-size: 23px; font-weight: 700; }
      .flow-label { fill: #53677b; font-size: 20px; }
      .call-flow { fill: none; stroke: #71869b; stroke-width: 2.6; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .api-flow { fill: none; stroke: #4b7187; stroke-width: 2.8; stroke-linecap: square; marker-end: url(#api-arrow); }
      .local-flow { fill: none; stroke: #7650a4; stroke-width: 2.8; stroke-linecap: square; marker-start: url(#purple-arrow); marker-end: url(#purple-arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#71869b"/></marker>
    <marker id="api-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4b7187"/></marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7650a4"/></marker>
  </defs>

